# game.toml — Sonic the Hedgehog (Sega Genesis/Mega Drive, 1991)
# 68000, 512KB ROM, no SRAM, no mapper
# CRC32 (JUE REV00): 0xF9394E97
# Product serial: GM 00001009-00  (header $0180)
# Internal checksum: $264A         (header $018E)
# Revision: 00 (original JUE release)

[game]
output_prefix = "sonic"
# Annotations: full s1disasm REV00 label set (~7300 entries).
annotations = "annotations_from_disasm.csv"

# Auto-generated discovery files (regen via tests/tools/gen_disasm_*.py).
# This game.toml only carries IRREDUCIBLE residual entries — things the
# extractors can't yet identify from the disasm alone.
discovery_files = [
    "sonic1.disasm_seeds.toml",        # Static JSR/BSR targets from sonic.lst
    "sonic1.disasm_subs.toml",         # Named subroutine labels not in seeds
    "sonic1.disasm_jumptables.toml",   # PC-indexed jump tables + bra-trampolines
]

# ---------------------------------------------------------------------------
# Per-game RAM layout — addresses + state-shape constants the shared
# runner code reads via g_game_layout (see runner/game_layout.h).
# Replaces the old Sonic-1-shaped hardcodes in glue.c / main.c /
# cmd_server.c. Source: s1.sonic.asm (s1disasm REV00).
# ---------------------------------------------------------------------------
[ram_layout]
game_mode      = 0xFFF600   # v_gamemode
vint_runcount  = 0xFFFE0C   # v_vblank_count (longword, +1 per VBla)
vint_routine   = 0xFFF62A   # v_vbla_routine (byte, dispatch index)
plc_pending    = 0xFFF6F8   # v_plc_buffer_count (16-bit; gates RunPLC periodic)
initial_ssp    = 0xFFFE00   # SSP from reset vector $0
vbla_stack     = 0xFFD000   # VBlank-handler stack base (Sonic 1 historical)
intr_stack     = 0xFFD000   # IRQ-handler stack base
player_object  = 0xFFD000   # Sonic's object slot ($D000 in S1)
level_modes    = [0x08, 0x0C]   # GM_Demo, GM_Level — gameplay states

# ---------------------------------------------------------------------------
# Widescreen (16:9) opt-in. Engine renders extra centered columns; the patched
# disasm widens tile-load / object-cull bounds via the Widescreen_extra RAM
# word the engine writes each frame (0 = authentic 4:3). Sonic 1 has no
# 2-player mode, so two_player_addr is omitted (gate disabled).
[widescreen]
capable          = true
max_extra_cells  = 8             # 8 cells (64px)/side -> 448px (16:9)
eligible_modes   = [0x08, 0x0C]  # EXACT: GM_Demo, GM_Level
# NO extra_ram_addr / redraw_flag_addr: those were the LEGACY disasm RAM-word path
# (Widescreen_extra carved from v_timingandscreenvariables). This build recompiles
# the ORIGINAL unmodified ROM where 0xFFFF38 is LIVE game state — writing it would
# corrupt RAM. Widening is done entirely by the [[widescreen_site]] injection below
# (reads g_ws_margin; 0 => byte-identical 4:3). PSX-style post-patch layer.

# ---------------------------------------------------------------------------
# [[widescreen_site]] — post-patch widening injection (recompile-original-ROM,
# PSX-style). Each entry widens ONE canonical-ROM instruction by the runtime
# g_ws_margin (extra px/side; 0 => no-op). Addresses verified against
# _s1disasm/sonic_canonical.lst; the set mirrors exactly what the shipped disasm
# widescreen widened (incl. leaving DrawBGScrollBlock1 top/bottom vanilla).
# ---------------------------------------------------------------------------

# Sprite-X 10-bit mask (BuildSpr_Normal/FlipX/FlipY/FlipXY): andi #$1FF -> #$3FF
[[widescreen_site]]
addr = 0xD786
kind = "mask10"
[[widescreen_site]]
addr = 0xD7D4
kind = "mask10"
[[widescreen_site]]
addr = 0xD81A
kind = "mask10"
[[widescreen_site]]
addr = 0xD86E
kind = "mask10"

# Object cull — left edge widened via cull_left (bmi), right via subreg before cmpi #320.
# BuildSprites (d1):
[[widescreen_site]]
addr = 0xD6A2
kind = "cull_left"
reg  = 1
[[widescreen_site]]
addr = 0xD6AA
kind = "subreg"
reg  = 1
# ChkObjectVisible (d0, shared across both edges — cull_left is non-mutating):
[[widescreen_site]]
addr = 0xD886
kind = "cull_left"
reg  = 0
[[widescreen_site]]
addr = 0xD888
kind = "subreg"
reg  = 0
# ChkPartiallyVisible (d0):
[[widescreen_site]]
addr = 0xD8B6
kind = "cull_left"
reg  = 0
[[widescreen_site]]
addr = 0xD8BC
kind = "subreg"
reg  = 0

# Tile-load FG column seeds: moveq #-16,d5 left start -> -margin (subimm reg=5)
[[widescreen_site]]
addr = 0x68FA
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6902
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6912
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x691C
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x692A
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6932
kind = "subimm"
reg  = 5
# FG right column seeds: move.w #320,d5 -> +margin (addimm reg=5)
[[widescreen_site]]
addr = 0x6940
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0x694A
kind = "addimm"
reg  = 5
# BG scroll-block edge column seeds (loc_698E left, loc_69BE right, DrawBGScrollBlock2 left, loc_6A3E right)
[[widescreen_site]]
addr = 0x6996
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x699E
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x69C6
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0x69D0
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0x6A16
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6A1E
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6A54
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0x6A5E
kind = "addimm"
reg  = 5
# DrawChunks (initial full-screen fill) left start: moveq #0,d5 -> -margin
[[widescreen_site]]
addr = 0x6C86
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x6C90
kind = "subimm"
reg  = 5
# FG row-block count (DrawBlocks_LR internal moveq #21,d6 -> +margin/8 blocks; FG-only entry)
[[widescreen_site]]
addr = 0x6AD8
kind = "addimm"
reg  = 6
shift = 3

