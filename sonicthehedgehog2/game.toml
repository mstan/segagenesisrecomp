# game.toml — Sonic the Hedgehog 2 (Sega Genesis/Mega Drive, 1992)
# 68000, 1MB ROM, no SRAM, no mapper
# Product serial: GM 00001051-01  (header $0180)
# Internal checksum: $D951        (header $018E)
# Region: JUE
# Entry PC: $000206 (vector $000004)
# VBlank handler: $000408 (vector $000078)
# HBlank handler: $000F54 (vector $000070)

[game]
output_prefix = "sonic2"

# Annotation CSV: 2949 (addr,name) pairs — surfaces meaningful labels
# in generated C (e.g. EntryPoint, VBlank instead of func_000206).
annotations = "annotations_from_disasm.csv"

# Auto-generated discovery files (regenerate via the gen_disasm_*.py
# tools, paths relative to this game.toml). The labels file is the
# disasm's own ground truth — every assembler-resolved label↔offset
# pair, with data labels filtered. It supersedes the older seeds + subs
# heuristics. The jumptables file complements it with [[jump_table]]
# records the recompiler's auto-discovery can't follow.
#
# Regenerate via:
#   python ../tests/tools/gen_disasm_labels.py s2disasm/s2.lst \
#       > sonic2.disasm_labels.toml
#   python ../tests/tools/gen_disasm_jumptables.py \
#       --lst s2disasm/s2.lst \
#       --code-addrs ../tests/fixtures/sonic2/l1/code_addresses.txt \
#       --prefix sonic2 --rom-max 0x100000 \
#       -o sonic2.disasm_jumptables.toml
discovery_files = [
    "sonic2.disasm_labels.toml",
    "sonic2.disasm_jumptables.toml",
]

# ---------------------------------------------------------------------------
# Per-game RAM layout — see runner/game_layout.h. Source: s2.constants.asm
# resolved through s2.lst.
#
# Important per-game divergences vs Sonic 1:
#   - vbla_stack is $FFFE00, NOT $FFD000.  Sonic 2's Object_RAM_End is at
#     $FFD000, so the previous hardcode placed the VBlank-handler stack
#     immediately past Sonic's dynamic object table — and the 256-byte
#     save window at $FFCF00..$FFCFFE landed *inside* Dynamic_Object_RAM.
#     Every VBla was clobbering 2 dynamic-object slots and restoring them
#     ~immediately, but any VInt push >256 bytes silently corrupted other
#     objects. Move the stack to the initial-SSP scratch region instead.
#   - player_object is $FFB000 (Object_RAM start), not $FFD000.
#   - plc_pending is 0 (call_periodic is NULL on Sonic 2; gate isn't read).
# ---------------------------------------------------------------------------
[ram_layout]
game_mode      = 0xFFF600   # Game_Mode
vint_runcount  = 0xFFFE0C   # Vint_runcount (longword, +1 per VBla)
vint_routine   = 0xFFF62A   # Vint_routine (byte, dispatch index)
plc_pending    = 0x000000   # no periodic hook wired
initial_ssp    = 0xFFFE00   # SSP from reset vector $0
vbla_stack     = 0xFFFE00   # safe scratch top — NOT $FFD000 (object table)
intr_stack     = 0xFFFE00
player_object  = 0xFFB000   # MainCharacter (Reserved_Object_RAM start)
level_modes    = [0x08, 0x0C]   # GM_Demo, GM_Level (high bit may set on transition)

# ---------------------------------------------------------------------------
# Widescreen (16:9) opt-in — engine renders extra centered columns and the
# recompiled 68K (patched disasm) widens its object-cull / tile-load bounds
# by reading the word the engine writes to extra_ram_addr each frame. 4:3
# stays the authentic default (engine writes 0 unless the user opts in AND
# the game is in a gameplay mode). eligible_modes omitted => falls back to
# level_modes above (widen demo + level; pillarbox title/menus/special).
# extra_ram_addr = $FFFFF100: first word of the $FFFFF100-$FFFFF5FF region
# the S2 RAM map marks unused (S1 sound-driver leftover); see s2.constants.asm.
[widescreen]
capable         = true
max_extra_cells = 8         # 8 cells (64px)/side -> 448px (16:9). Capped so the
                           # widened tile-row redraw stays within Block_cache (32
                           # blocks): base 22 + 2*cells <= 32.
# EXACT match (no 0x7F mask): GM_Demo, GM_Level, plus their 0x80-flagged
# transition values (0x88/0x8C) so the margin is ALREADY armed while the
# level-load sequence (Level_TtlCard -> DrawInitialBG + initial FG fill)
# runs. That makes the initial fills margin-aware from frame 0: the BG
# cameras all start ratio-aligned at load, so DrawInitialBG's full-512px
# uniform fill is strip-correct including the revealed margins, and the
# widened per-strip seam maintenance keeps them correct thereafter. This
# replaces the old level_started_addr gate (removed below), which forced
# the whole load to run at margin 0 and left Plane B's margins holding
# wrap-around content on arm (the CPZ "diagonal corruption").
eligible_modes     = [0x08, 0x0C, 0x88, 0x8C]
# NO level_started_addr: the engine skips that gate when the field is absent.
# The gate predated the redraw-flag/injection design (c583c0e pillarboxed the
# title card by construction); with it, 16:9 armed only after the title card,
# strictly later than the level's own margin-filling draws.
two_player_addr    = 0xFFFFD8       # Two_player_mode (word): require == 0 to widen (read-only gate)
redraw_flag_addr   = 0xFFF72C       # Screen_redraw_flag: the canonical ROM's OWN full-redraw
                                    # flag (s2.asm tst.b @ 18588; game sets it for WFZ piston etc).
                                    # Engine sets it 1 when 16:9 ARMS -> the game's full redraw runs
                                    # (now with margin>0, via the widened Draw_All) and FILLS the
                                    # revealed margins. Without this the initial fill ran at margin 0
                                    # -> stale margin VRAM -> static "diagonal noise" standing still.
                                    # Safe to write (it's a real game flag, not a carved word).
# NO extra_ram_addr: that WAS the legacy carved Widescreen_extra word (0xFFFFF100 is live
# canonical state). Content widening is the [[widescreen_site]] injection below (g_ws_margin).

# ---------------------------------------------------------------------------
# [[widescreen_site]] — PSX-style post-patch injection (canonical s2_canonical.lst).
# Object culls + tile-load column seeds + FG/Draw_All per-row block count (the
# count fixes the diagonal tile-tearing during diagonal scroll — same as S1's
# DrawBlocks_LR widen). The row count uses `call_widen`: it retargets the 3
# FG/Draw_All DrawBlockRow callers (DADE/DB0C/DB26) to DrawBlockRow_CustomWidth
# @ DF8A with d6 preset = 21 + margin/8, so ONLY those 3 widen — the other 6
# DrawBlockRow callers (BG rows) stay at 21, matching the shipped disasm.
# RingsManager visible-window cull is now widened too (cull_window_left + addreg
# scale=2) — see the entries below. Margins are filled on 16:9 arm via the game's
# own Screen_redraw_flag (redraw_flag_addr above) running the widened Draw_All.
# ---------------------------------------------------------------------------

# Object cull (BuildSprites, d1): left via cull_left (bmi), right via subreg before cmpi #320.
[[widescreen_site]]
addr = 0x16668
kind = "cull_left"
reg  = 1
[[widescreen_site]]
addr = 0x16670
kind = "subreg"
reg  = 1
[[widescreen_site]]
addr = 0x1673A
kind = "cull_left"
reg  = 1
[[widescreen_site]]
addr = 0x16742
kind = "subreg"
reg  = 1

# Tile-load LEFT column seeds: moveq #-16,d5 -> -margin (subimm reg=5)
# Draw_All, Draw_FG (up/down/left), Draw_BG1 (left), SBZ adv-BG, CPZ adv-BG.
[[widescreen_site]]
addr = 0xDAD2
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDADC
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB02
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB0A
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB1A
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB24
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB32
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB3A
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDC00
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDC08
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDD5A
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDE56
kind = "subimm"
reg  = 5

# Tile-load RIGHT column seeds: move.w #320,d5 -> +margin (addimm reg=5)
# Draw_FG (right), Draw_BG1 (right), SBZ adv-BG, CPZ adv-BG.
[[widescreen_site]]
addr = 0xDB48
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0xDB52
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0xDC16
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0xDC20
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0xDD68
kind = "addimm"
reg  = 5
[[widescreen_site]]
addr = 0xDE64
kind = "addimm"
reg  = 5

# Title-card progressive screen fill (loc_15758, the 2-rows-per-step draw that
# paints the level behind the title card): each row is a FULL 512px plane row
# (d6=$1F into DrawBlockRow_CustomWidth) anchored at camera-16. Unwidened, the
# leftmost margin-16 px of the widescreen view showed plane cells whose content
# wrapped from 512px to the RIGHT (world x 512..560 at a level start with the
# camera clamped to Min+margin) — the "discontinuous ground" at level starts.
# Widening both d5 seeds to -16-margin anchors the same full-width row one
# margin further left, so every visible cell gets LOCAL content; the wrap cells
# move to camera+432..496, past the visible right edge (camera+384). The count
# ($1F) is untouched — still one full plane row. P2 copy ($1573A/$15744) left
# alone (2P margin is always 0). margin 0 => byte-identical.
[[widescreen_site]]
addr = 0x1576E            # moveq #-16,d5 before CalculateVRAMAddress (P1 fill)
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0x15778            # moveq #-16,d5 before DrawBlockRow_CustomWidth
kind = "subimm"
reg  = 5

# Sprite-X 10-bit mask (DrawSprite piece writers: Normal/FlipX/FlipY/FlipXY):
# andi #$1FF -> #$3FF, same recipe as Sonic 1 (D786/D7D4/D81A/D86E). Without
# it, widened sprite positions >= 512 (right margin band) wrapped to the LEFT
# edge — the EHZ2 boss "rapidly switching sides" while hovering off the right
# edge, and any right-margin object ghosting at screen-left. Static widen is
# safe: at 4:3 sprite x never reaches 512, so $3FF == $1FF behaviorally.
# BuildSprites_2P piece writers ($16DE4+) untouched (widescreen off in 2P).
[[widescreen_site]]
addr = 0x16844            # DrawSprite_Loop (no flip)
kind = "mask10"
[[widescreen_site]]
addr = 0x16884            # DrawSprite_FlipX
kind = "mask10"
[[widescreen_site]]
addr = 0x168DC            # DrawSprite_FlipY
kind = "mask10"
[[widescreen_site]]
addr = 0x1692E            # DrawSprite_FlipXY
kind = "mask10"

# Player left level-bound (Sonic_LevelBound / Tails_LevelBound): the wall is
# Camera_Min_X_pos + $10, read via `move.w (abs).w,d0`. Unwidened, the player
# could walk `margin` px into the revealed left margin (the camera, clamped at
# Min+margin, no longer follows) and stand over layout the designers never
# meant to be playable — the "Sonic floats" report. addmem widens the bound
# read to Min+margin, capped (base=2) at the Max word right after it, so a
# boss lock (Min == Max) keeps the authentic arena width. The game's own
# addi #$10 then lands on top: wall = min(Min+margin, Max) + $10 — 16px inside
# the 4:3 window, exactly the authentic wall-to-camera geometry.
# gate = Current_Boss_ID ($FFF7AA): while a boss is active the bound stays
# fully authentic — S2 boss locks are NOT always Min == Max (EHZ2 locks
# $28F0/$2940), so the Max cap alone would still eat `margin` px of arena.
# The game's own right-bound check consults the same flag ($1A998).
[[widescreen_site]]
addr = 0x1A984            # Sonic_LevelBound: move.w (Camera_Min_X_pos).w,d0
kind = "addmem"
base = 2
gate = 0xFFF7AA
[[widescreen_site]]
addr = 0x1C56A            # Tails_LevelBound: move.w (Tails Min copy).w,d0
kind = "addmem"
base = 2
gate = 0xFFF7AA

# FG/Draw_All per-row block count: retarget DrawBlockRow (DF92, resets d6=21) ->
# DrawBlockRow_CustomWidth (DF8A) with d6 preset = 21 + margin/8. Only these 3
# callers widen; the 6 BG-row DrawBlockRow callers keep 21 (matches the disasm).
[[widescreen_site]]
addr   = 0xDADE          # Draw_All draw call
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A
[[widescreen_site]]
addr   = 0xDB0C          # Draw_FG scroll_up redraw
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A
[[widescreen_site]]
addr   = 0xDB26          # Draw_FG scroll_down redraw
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A

# RingsManager visible-window cull: widen [camera-8, camera-8+336] by margin/side.
# LEFT clamp: at the `bhi` after `subq #8,d4`, cull_window_left mutates d4 -= margin
# and switches bhi->bgt (the inserted sub breaks bhi's borrow). RIGHT edge: addreg
# d4 by 2*margin BEFORE `addi #screen_width+16,d4` (undo the left -margin + add the
# right +margin). Two copies: RingsManager_Init and RingsManager_Main.
[[widescreen_site]]
addr  = 0x16FAC          # RingsManager_Init: left-window bhi
kind  = "cull_window_left"
reg   = 4
[[widescreen_site]]
addr  = 0x16FC4          # RingsManager_Init: right-window addi (inject 2*margin before)
kind  = "addreg"
reg   = 4
scale = 2
[[widescreen_site]]
addr  = 0x1701E          # RingsManager_Main: left-window bhi
kind  = "cull_window_left"
reg   = 4
[[widescreen_site]]
addr  = 0x17040          # RingsManager_Main: right-window addi (inject 2*margin before)
kind  = "addreg"
reg   = 4
scale = 2

# BG vertical-scroll row draws: when the BG scrolls up/down, the new top/bottom
# row is drawn 22 blocks wide from d5=-16 (Draw_BG1 simple rows @ DBCE/DBE4,
# Draw_BG3_CPZ per-strip-camera rows @ DE24) — the disasm reference never
# widened these, so vertical movement in 16:9 left margin-wide holes at the
# revealed sides ("random missing sections" in CPZ, which scrolls vertically
# everywhere). Same recipe as Draw_All: widen both d5 seeds (start -16-margin)
# and retarget the DrawBlockRow call (DF92, resets d6=21) to
# DrawBlockRow_CustomWidth (DF8A) with d6 preset 21 + margin/8.
# Draw_BG1 scroll-up row (flag bit 0):
[[widescreen_site]]
addr = 0xDBD0            # moveq #-16,d5 before CalculateVRAMAddress
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDBD8            # moveq #-16,d5 before DrawBlockRow
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr   = 0xDBDA          # bsr DrawBlockRow -> CustomWidth, d6 = 21 + margin/8
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A
# Draw_BG1 scroll-down row (flag bit 1):
[[widescreen_site]]
addr = 0xDBE8
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr = 0xDBF2
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr   = 0xDBF4
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A
# Draw_BG3_CPZ scroll-up/down row (shared tail @ DE24; per-row camera from the
# DDD1 strip table, so the widened row is drawn at the OWNING strip's offset):
[[widescreen_site]]
addr = 0xDE3C            # moveq #-16,d5 (pushed, feeds both E286 and the row draw)
kind = "subimm"
reg  = 5
[[widescreen_site]]
addr   = 0xDE4A
kind   = "call_widen"
reg    = 6
base   = 21
shift  = 3
target = 0xDF8A

# ---------------------------------------------------------------------------
# HUD anchor: BuildHUD_P1 positions every 1P HUD piece with a `move.w #x,d3`
# immediate right before its sprite-piece draw call. subimm shifts each X left
# by the margin, so the HUD keeps its authentic 16px inset from the TRUE
# widescreen left edge (margin 0 => authentic positions, byte-identical).
# BuildHUD_P2/P2_Continued (2P split HUD, $409C6+) are untouched — widescreen
# is gated off in 2P anyway.
[[widescreen_site]]
addr = 0x40836           # BuildHUD ring-flash piece (x=$90)
kind = "subimm"
reg  = 3
[[widescreen_site]]
addr = 0x4088C           # BuildHUD_P1_Continued: SCORE/TIME/RINGS block (x=$90)
kind = "subimm"
reg  = 3
[[widescreen_site]]
addr = 0x408AC           # time digits (x=$B8)
kind = "subimm"
reg  = 3
[[widescreen_site]]
addr = 0x408D0           # ring digits (x=$C0)
kind = "subimm"
reg  = 3
[[widescreen_site]]
addr = 0x408F2           # conditional timer sub-field (x=$110)
kind = "subimm"
reg  = 3
[[widescreen_site]]
addr = 0x4090A           # lives block (x=$90)
kind = "subimm"
reg  = 3

# ---------------------------------------------------------------------------
# Camera left-bound clamp: ScrollHoriz compares/loads Camera_Min_X_pos through
# (a2). addmem widens that bound to Min+margin, capped at Camera_Max_X_pos
# (the word at (a2)+2 — base=2), never below authentic Min. The camera then
# stops `margin` px inside the level's left boundary, so the revealed left
# margin is always REAL level data — no more wrap artifact at level starts —
# while a boss lock (Min == Max) degrades to authentic behavior (no snap or
# oscillation). Both the cmp and its clamp store carry the site so they agree.
# Right/Max side deliberately NOT clamped: LevEvents boss triggers wait for
# the camera to REACH Camera_Max_X_pos; shrinking it risks softlocks.
[[widescreen_site]]
addr = 0xD750            # cmp.w (a2),d0 — left-bound check
kind = "addmem"
base = 2
[[widescreen_site]]
addr = 0xD754            # move.w (a2),d0 — left-bound clamp store
kind = "addmem"
base = 2
# Initial camera at level load (LevelSizeLoad): the clamp-to-zero of
# `player_x - $A0` becomes clamp-to-margin, so the level fades in already
# clamped (no post-fade snap). Starts deeper than $A0+margin are untouched
# (authentic camera) — ScrollHoriz's clamp above covers any residue.
[[widescreen_site]]
addr = 0xC19C            # moveq #0,d1 — initial camera X clamp
kind = "addimm"
reg  = 1

# ---------------------------------------------------------------------------
# Interrupt vectors (from 68K vector table)
[functions]
extra = [
    0x000206,   # EntryPoint â€” initial PC ($000004)
    0x000408,   # VBlank (IRQ level 6) â€” vector $000078
    0x000F54,   # HBlank (IRQ level 4) â€” vector $000070
    0x0051FC,   # SS per-frame loop top (s2disasm s2.asm: the anonymous "-"
                # label after SpecialStage init â€” "bsr PauseGame / cmpi.b
                # #GameModeID_SpecialStage,(Game_Mode) / ... / bsr SSTrack_Draw").
                # Needed as a dispatch entry so save-state loads can resume
                # the special stage moment-in-time (GameSpec save_resume_pc).
]

# ---------------------------------------------------------------------------
# Known-dynamic dispatch sites â€” intentionally absent from any
# [[jump_table]] directive because the dispatcher computes its target
# at runtime from RAM contents. The recompiler's static walker logs
# these in sonic2.unresolved_jumptables.log; they are NOT bugs.
#
#   $001568   NemDec_TableSelect: `jmp (a3)` where a3 holds a function
#             pointer chosen during Nemesis decompression based on
#             compressed-stream state. Targets (NemPCD_WriteRowToVDP,
#             NemPCD_WriteRowToVDP_XOR, NemPCD_WriteRowToRAM,
#             NemPCD_WriteRowToRAM_XOR) are labeled in s2.lst and
#             therefore present in sonic2.disasm_labels.toml's
#             [functions].extra, so call_by_address resolves correctly
#             at runtime. This site fires every frame during title-
#             screen art decompression; an empty dispatch_misses.log
#             after a multi-second run confirms coverage.
