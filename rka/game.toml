blacklist = [0x001C74]

# RKA's central object dispatcher indexes exactly 391 absolute-long function
# pointers. The exclusive end is proven by the next non-pointer longword at
# $29F4 ($4E750000: RTS opcode + padding). Entries beyond the finder's global
# cap are registered as non-recursive callable roots.
[[jump_table]]
start = 0x0023D8
end = 0x0029F4
stride = 4
format = "abs"
