# game.toml — Sonic the Hedgehog 3 (USA, 1994), STANDALONE (no lock-on).
# 68000, 2 MB ROM, flat at $000000-$1FFFFF. Identity-mapped (no banks).
#
# This is "Sonic 3 mode" — the first of three planned modes (Sonic 3 alone,
# Sonic & Knuckles alone, Sonic 3 & Knuckles locked-on). Standalone Sonic 3
# is the cleanest target: a single 2 MB ROM whose code runs at its own org-0
# addresses, so file offset == runtime address == disasm address. NO +$200000
# offset, no cross-half lock-on calls, no bank-switching.
#
# ROM identity (verified): CRC32 9BC192CE, MD5 d724ea4d…, == skdisasm s3built.bin
# (buildS3.lua, Sonic3_Complete=0). Header: "SONIC THE HEDGEHOG 3", serial
# GM MK-1079, region U. See memory project_canonical_s3k_rom.
#
# Boot/dispatch addresses (from s3.lst, org 0):
#   EntryPoint $206, GameLoop $734, VInt (VBlank) $802, HInt (HBlank) $FA2.

[game]
output_prefix = "sonic3"

# Real labels from the byte-perfect S3 disasm (s3.lst), emitted at OFFSET 0
# (standalone Sonic 3 runs at $000000). Regenerate via:
#   python ../tests/tools/gen_disasm_labels.py     ../sonic3k/skdisasm/s3.lst --max-addr 0x200000 --offset 0 > sonic3.disasm_labels.toml
#   python ../tests/tools/gen_disasm_jumptables.py --lst ../sonic3k/skdisasm/s3.lst --prefix sonic3 --rom-max 0x200000 --offset 0 -o sonic3.disasm_jumptables.toml
#   python ../tests/tools/gen_code_addrs.py        ../sonic3k/skdisasm/s3.lst --max-addr 0x200000 --offset 0 > sonic3.code_addrs.txt
#   python ../tests/tools/gen_annotations_csv.py   --lst ../sonic3k/skdisasm/s3.lst --max-addr 0x200000 --offset 0 -o annotations_from_disasm.csv
annotations     = "annotations_from_disasm.csv"
code_addrs_file = "sonic3.code_addrs.txt"
discovery_files = [
    "sonic3.disasm_labels.toml",       # 10,966 code labels
    "sonic3.disasm_jumptables.toml",   # 272 tables / 1,448 targets
]

# ---------------------------------------------------------------------------
# Per-game RAM layout — Sonic 3 uses the shared Sonic engine WRAM map
# (verified against s3.lst constants; same offsets as the S3K combined).
# ---------------------------------------------------------------------------
[ram_layout]
game_mode      = 0xFFF600   # Game_mode
vint_runcount  = 0xFFFE0C   # V_int_run_count (longword)
vint_routine   = 0xFFF62A   # V_int_routine
plc_pending    = 0x000000
initial_ssp    = 0xFFFE00   # System_stack — set by `lea (System_stack).w,sp` at EntryPoint
vbla_stack     = 0xFFFE00
intr_stack     = 0xFFFE00
player_object  = 0xFFB000   # Player_1 / Object_RAM start
level_modes    = [0x08, 0x0C]

# ---------------------------------------------------------------------------
# Widescreen (16:9) opt-in. Engine renders extra centered columns; the patched
# skdisasm widens object cull / tile-load bounds via the Widescreen_extra RAM
# word the engine writes each frame (0 = authentic 4:3). Shared skdisasm macros
# (sonic3k.macros.asm) gate every widening on that word.
[widescreen]
capable          = true
max_extra_cells  = 8             # 8 cells (64px)/side -> 448px (16:9)
eligible_modes   = [0x08, 0x0C]  # EXACT: GM_Level (GameModesArray $08/$0C both -> Level)
level_started_addr = 0xFFF711    # Level_started_flag (byte): require != 0 to widen (read-only gate)
two_player_addr    = 0xFFFFD8    # Competition_mode (S3-alone map): require == 0 to widen (read-only gate)
# NO extra_ram_addr / redraw_flag_addr: those were the LEGACY disasm carved bytes
# (Widescreen_extra/Widescreen_redraw in the ds.b $14 block) which the CANONICAL ROM
# does NOT read. Content widening = the [[widescreen_site]] injection below (g_ws_margin).
# Margin-fill-on-arm (if S3 needs it like S2) is handled separately — TBD after baseline.

# ---------------------------------------------------------------------------
# [[widescreen_site]] — PSX-style post-patch injection (canonical s3_canonical.lst).
# Render_Sprites culls + sprite-X masks + DrawTilesAsYouMove tile row/columns +
# Render_Rings window. Addresses verified against s3_canonical.lst.
# ---------------------------------------------------------------------------

# Sprite-X 10-bit mask (Render_Sprites / sprite writer): andi.w #$1FF,d2 -> #$3FF
[[widescreen_site]]
addr = 0x195EE
kind = "mask10"
[[widescreen_site]]
addr = 0x19628
kind = "mask10"
[[widescreen_site]]
addr = 0x19678
kind = "mask10"
[[widescreen_site]]
addr = 0x196C0
kind = "mask10"

# Render_Sprites object cull (d3, reloaded between edges): left bmi (cull_left),
# right cmpi #320 (subreg). 3 blocks.
[[widescreen_site]]
addr = 0x193F0
kind = "cull_left"
reg  = 3
[[widescreen_site]]
addr = 0x193F6
kind = "subreg"
reg  = 3
[[widescreen_site]]
addr = 0x194CE
kind = "cull_left"
reg  = 3
[[widescreen_site]]
addr = 0x194D6
kind = "subreg"
reg  = 3
[[widescreen_site]]
addr = 0x19510
kind = "cull_left"
reg  = 3
[[widescreen_site]]
addr = 0x19518
kind = "subreg"
reg  = 3

# Tile-load columns (Draw_TileColumn / Draw_TileColumn2, on d0). LEFT subreg at the
# tst.b d2 (after the beq) — applies to both paths but the RIGHT path reloads d0
# (move.w d3,d0), so it nets to the LEFT column only. RIGHT addreg BEFORE the
# addi #$150,d0 — this is RIGHT-PATH-ONLY because the `bpl` (moved-left) branched
# past it to loc_*. (Injecting at the post-addi merge label instead would cancel the
# LEFT subreg on the left path -> stale left-scroll tiles.)
[[widescreen_site]]
addr = 0x397F2
kind = "subreg"
reg  = 0
[[widescreen_site]]
addr = 0x397FA
kind = "addreg"
reg  = 0
[[widescreen_site]]
addr = 0x39834
kind = "subreg"
reg  = 0
[[widescreen_site]]
addr = 0x3983C
kind = "addreg"
reg  = 0

# FG tile-row (DrawTilesAsYouMove @ 39C3C = moveq #$15,d6 right after move.w
# Camera_X,d1): TWO transforms at one addr — subreg d1 (X-start, left) + addimm d6
# (count = 21 + margin/8, both sides). Draw_TileRow uses the caller's d6, so this
# widens ONLY the FG row (the BG twin moveq @ 39C60 is untouched).
[[widescreen_site]]
addr = 0x39C3C
kind = "subreg"
reg  = 1
[[widescreen_site]]
addr  = 0x39C3C
kind  = "addimm"
reg   = 6
shift = 3

# Render_Rings visible-window cull: LEFT subreg d4 BEFORE subq #8,d4 (keeps the
# subq's flags so bhi is unchanged); RIGHT addreg d4 scale=2 BEFORE addi #$150,d4.
[[widescreen_site]]
addr = 0xF682
kind = "subreg"
reg  = 4
[[widescreen_site]]
addr  = 0xF6AA
kind  = "addreg"
reg   = 4
scale = 2

# ---------------------------------------------------------------------------
# Discovery comes entirely from the byte-perfect s3.lst label set + heuristic
# finder. extra/blacklist are IRREDUCIBLE residual only (Principle 16); a
# dispatch_misses.log entry after a run is a coverage gap to root-cause in the
# gen_disasm pipeline, NOT to hand-add here.
[functions]
blacklist = [
]
extra = [
]
