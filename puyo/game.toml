  0x004450, 0x0049BE, 0x00D2F8, 0x0108E4, 0x01090A, 0x00D2EC,
  0x0040BC, 0x0040C0, 0x0040C8, 0x0042BE, 0x0042C6, 0x0042CA,
  0x010940, 0x01096A, 0x010984,
  # Stage-1/menu path reached by puyo_menu_probe.input.
  0x002EBA, 0x0011D0, 0x003056, 0x002A54, 0x002AB0,
