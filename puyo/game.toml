# game.toml — Puyo Puyo (Compile / SEGA, 1992). Japan NTSC, 512 KB ROM.
# 68000, flat $000000-$07FFFF, identity-mapped (no banks, no SRAM).
#
# Second non-Sonic bring-up, and like RKA there is NO community disassembly
# in-tree: discovery is the recompiler's heuristic (vector-table scan +
# BSR/JSR/RTS walk) seeded by the entry + interrupt handlers, then refined by
# the dispatch-miss / Tier-3 floor / coverage-manifest loop. Every lead is
# cross-checked against the raw ROM before becoming a seed (PRINCIPLES #16) —
# never blind-seeded from dispatch_misses.log.
#
# ROM identity: header "PUYOPUYO", serial GM G-4082 -00, region "J" (NTSC),
# (C)SEGA 1992.SEP, CRC32 7F26614E. Vectors (from $000000):
#   SSP   $00FFFC00
#   Entry $000200
#   H-int $0006AC   (IRQ4)
#   V-int $000524   (IRQ6)
# Every other vector points at one shared handler, $00050C.

[game]
output_prefix = "puyo"
# No annotations / discovery_files / code_addrs_file: pure-heuristic discovery,
# same posture as rka/game.toml. Enable the pcrel16 jump-table auto-walk, which
# is off by default for the Sonic games (they seed tables from disasm) and is
# what a table-driven game with no disasm needs. Validator-gated.
jump_table_autodiscovery = true

# ---------------------------------------------------------------------------
# Per-game RAM layout. Puyo Puyo is not Sonic, so the Sonic-shaped tracking
# fields (game_mode / vint_routine / player_object) are UNKNOWN and left 0 —
# those are cosmetic and only feed boot_smoke / telemetry. The LOAD-BEARING
# stack fields use the real reset SSP $00FFFC00 from the vector table. Refine
# the cosmetic addresses later from the V-int code at $000524.
# ---------------------------------------------------------------------------
[ram_layout]
game_mode      = 0x000000     # unknown (cosmetic) — refine from disasm
vint_runcount  = 0x000000     # unknown (divergence-diff sync only) — refine
vint_routine   = 0x000000     # unknown (yield-gate tracing) — refine
plc_pending    = 0x000000     # no Sonic-style PLC system
initial_ssp    = 0x00FFFC00   # reset SSP (LOAD-BEARING)
vbla_stack     = 0x00FFFC00   # V-int handler stack base (LOAD-BEARING)
intr_stack     = 0x00FFFC00   # IRQ handler stack base (LOAD-BEARING)
player_object  = 0x000000     # unknown (cosmetic)
level_modes    = []

# Heuristic discovery is seeded from the vector table automatically; list the
# entry and both interrupt handlers explicitly as well. $00050C is the shared
# error/unused-vector handler — a real function, so it is seeded too.
# A dispatch_misses.log entry after a run is a coverage gap to root-cause in
# discovery (PRINCIPLES #13/#16), cross-checked against the ROM — NOT blind
# seeding. late_extra stays empty until a run produces audited evidence.
[functions]
# $F90C is an audited mode dispatcher. Its `MOVEA.L $F926(PC,D0.W),A6;
# JMP (A6)` table is validator-enumerated only during normal discovery, so it
# must be an early root rather than arriving through a late handler closure.
extra = [0x000200, 0x000524, 0x0006AC, 0x00050C, 0x00F90C]
# $2A54/$2AB0 allocate object records and store the handler passed in A1.
# Registering that helper semantic lets discovery follow every structurally
# proven `LEA Handler,A1; BSR helper` edge without hand-listing 100+ handlers.
function_pointer_helpers = [0x002A54, 0x002AB0]

# Object-handler entries reached by `JSR (A1)` at $002A42, where A1 comes from
# `MOVEA.L $0002(A0),A1` — a per-object function pointer, the same shape as
# RKA's object dispatcher. Heuristic discovery walked $007E68 for 0x7104 bytes
# without finding a terminator and swallowed this whole cluster, so each target
# landed *inside* a 29 KB function: undispatchable, and the Tier-3 floor
# correctly declined them (capsule exit_pc $000324 != native return $002A44).
#
# Registered as late_extra so they become their own callable roots and split
# that overrun, WITHOUT recursively reopening heuristic discovery.
# Each one was decode-checked against the raw ROM before being listed here
# (PRINCIPLES #16) — not seeded from dispatch_misses.log on faith:
#   $00A4AA  007C 0700  ORI.W  #$0700,SR      (disable interrupts — prologue)
#   $00A4DC  303C 0023  MOVE.W #$0023,D0
#   $00A4EC  103C 0000  MOVE.B #$00,D0
#   $00A510  6100 009E  BSR.W  +$9E
#   $00A528  4239 ....  CLR.B  (xxx).L
#   $00A538  4EB9 ....  JSR    (xxx).L
#
# `$002B1C` and `$002B26` capture their caller's return address into object+$02,
# making each post-JSR continuation a later indirect-dispatch entry. Discovery
# now promotes those continuations even when the caller came from late_extra;
# that closes the A4AA state chain through $A59E without manual one-per-frame
# additions.
#
# The remaining entries below are decode-validated roots/leads exercised by a
# complete 1800-frame attract run. Initializer/state pairs such as
# $A49E->$A4AA and $C960->$C96C pass a handler address in A1 to the allocation
# helper at $2A54, so there is no literal pointer table to register.
late_extra = [
  0x00A4AA, 0x00A4DC, 0x00A4EC, 0x00A510, 0x00A528, 0x00A538,
  0x000FB8, 0x0021E2, 0x01DBB2, 0x00A49E, 0x00C960, 0x00C96C,
  0x0029D6, 0x00CE58, 0x00D0F0, 0x00CEBC, 0x00CE9E, 0x010B6C,
  0x000BA4, 0x00CA1E, 0x00D188, 0x010B8A,
  0x00CE2A, 0x010D20, 0x010DA2, 0x010E7A, 0x010F8A,
  0x00CA86, 0x00CAE8, 0x00CCFC,
  0x010BF4, 0x010C28, 0x0014C2,
  0x00CDB2, 0x00CDEE, 0x00CFE0, 0x00D040, 0x00CF06, 0x000C4C,
  0x00CF48, 0x00051E, 0x000EB4, 0x000EF0, 0x000F7A, 0x000FAA,
  0x00C9BA, 0x010560, 0x0105CC, 0x003006, 0x01048C, 0x00C9F0,
  0x014CDA, 0x014CC0, 0x014CAA, 0x01062A,
  0x010894, 0x0108B4, 0x003AE2, 0x003010,
  0x0104A4, 0x010514,
  0x0104CA, 0x01053A, 0x003B04, 0x00D27E, 0x00D2F2,
  0x00445E, 0x0045AA, 0x004C0A, 0x01009C, 0x0101B2, 0x010136,
  0x0048CE, 0x004C5C, 0x004624, 0x0049CC, 0x004A7A, 0x004A9C,
  0x001214, 0x00D306, 0x004820, 0x00483E, 0x004FE4, 0x00D2E6,
